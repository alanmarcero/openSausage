name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp:
    name: DSP / sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DOS_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS / universal
    runs-on: macos-14
    timeout-minutes: 30
    env:
      ARTEFACTS: build/openSausage_artefacts/Release
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Native editor and session tests
        run: build/sausage_editor_capture_artefacts/Release/sausage_editor_capture build/screenshots
      - name: Sign bundles ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openSausage.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openSausage.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/openSausage.app"
      - name: Validate VST3
        run: |
          curl --fail --location --silent --show-error -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openSausage.vst3"
      - name: Package
        run: |
          mkdir -p package/VST3 package/AU package/Standalone
          cp -R "$ARTEFACTS/VST3/openSausage.vst3" package/VST3/
          cp -R "$ARTEFACTS/AU/openSausage.component" package/AU/
          cp -R "$ARTEFACTS/Standalone/openSausage.app" package/Standalone/
          cp README.md LICENSE THIRD_PARTY.md package/
          ditto -c -k --keepParent package openSausage-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openSausage-macOS-universal
          path: openSausage-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macOS
          path: build/screenshots/*.png

  windows:
    name: Windows / x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ARTEFACTS: build/openSausage_artefacts/Release
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Native editor and session tests
        run: ./build/sausage_editor_capture_artefacts/Release/sausage_editor_capture.exe build/screenshots
      - name: Validate VST3
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openSausage.vst3"
      - name: Package
        run: |
          New-Item -ItemType Directory -Force package/VST3, package/Standalone | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openSausage.vst3" package/VST3/
          Copy-Item "$env:ARTEFACTS/Standalone/openSausage.exe" package/Standalone/
          Copy-Item README.md, LICENSE, THIRD_PARTY.md package/
          Compress-Archive -Path package -DestinationPath openSausage-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: openSausage-Windows-x64
          path: openSausage-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-Windows
          path: build/screenshots/*.png
