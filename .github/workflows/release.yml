name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    # update-preview in the called workflow declares contents: write. GitHub
    # checks that at startup, before the job if, so this caller must grant it.
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: openSausage-*
          merge-multiple: true
          path: dist
      - name: Publish validated packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          {
            cat docs/release-notes.md
            echo
            echo "![openSausage editor](https://raw.githubusercontent.com/alanmarcero/openSausage/$RELEASE_TAG/docs/screenshots/preview.png)"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" --title "openSausage $RELEASE_TAG"
